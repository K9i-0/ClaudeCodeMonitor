name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: macos-latest
    if: github.event.pull_request.merged == true
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.2.app
    
    - name: Determine version bump type
      id: version_type
      run: |
        # Check PR labels for version type
        LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
        echo "PR Labels: $LABELS"
        
        if [[ "$LABELS" == *"version:major"* ]]; then
          echo "type=major" >> $GITHUB_OUTPUT
        elif [[ "$LABELS" == *"version:minor"* ]]; then
          echo "type=minor" >> $GITHUB_OUTPUT
        else
          echo "type=patch" >> $GITHUB_OUTPUT
        fi
    
    - name: Determine next version
      id: version
      run: |
        VERSION_TYPE="${{ steps.version_type.outputs.type }}"
        echo "Determining next version: $VERSION_TYPE"
        
        # Check if get-next-version.sh exists and is executable
        if [ -f "./scripts/get-next-version.sh" ] && [ -x "./scripts/get-next-version.sh" ]; then
          echo "Using get-next-version.sh"
          # Get next version from git tags and output to GITHUB_OUTPUT
          ./scripts/get-next-version.sh "$VERSION_TYPE"
        else
          echo "Warning: get-next-version.sh not found or not executable"
          echo "Falling back to manual version calculation"
          
          # Fallback: Calculate version manually
          LATEST_TAG=$(git tag -l "v*.*.*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION=${LATEST_TAG#v}
          fi
          
          # Parse and increment version
          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]:-0}"
          MINOR="${VERSION_PARTS[1]:-0}"
          PATCH="${VERSION_PARTS[2]:-0}"
          
          case "$VERSION_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch|*)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          # Validate version
          if [ -z "$NEW_VERSION" ] || [ "$NEW_VERSION" = "0.0.0-dev" ]; then
            echo "Error: Failed to determine version"
            echo "Latest tags:"
            git tag -l "v*.*.*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -5
            exit 1
          fi
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
        fi
    
    # Check if we have signing certificates
    - name: Check signing prerequisites
      id: check_signing
      env:
        CERT_P12: ${{ secrets.CERTIFICATES_P12 }}
        CERT_PWD: ${{ secrets.CERTIFICATES_PASSWORD }}
        NOTARIZE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
        NOTARIZE_PWD: ${{ secrets.NOTARIZATION_PASSWORD }}
        NOTARIZE_TEAM: ${{ secrets.NOTARIZATION_TEAM_ID }}
      run: |
        if [ -n "$CERT_P12" ] && [ -n "$CERT_PWD" ]; then
          echo "has_signing_cert=true" >> $GITHUB_OUTPUT
          echo "✅ Signing certificates found"
        else
          echo "has_signing_cert=false" >> $GITHUB_OUTPUT
          echo "⚠️ No signing certificates configured"
        fi
        
        if [ -n "$NOTARIZE_ID" ] && [ -n "$NOTARIZE_PWD" ] && [ -n "$NOTARIZE_TEAM" ]; then
          echo "has_notarization=true" >> $GITHUB_OUTPUT
          echo "✅ Notarization credentials found"
        else
          echo "has_notarization=false" >> $GITHUB_OUTPUT
          echo "⚠️ No notarization credentials configured"
        fi
    
    # Setup keychain if we have certificates
    - name: Set up keychain
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        # Create a temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        
        # Add to search list
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
        security default-keychain -s "$KEYCHAIN_PATH"
        
        # Store for later use
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
        echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
    
    # Import certificates
    - name: Import certificates
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      env:
        CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
        CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
      run: |
        # Decode and import certificate
        echo "$CERTIFICATES_P12" | base64 --decode > certificate.p12
        
        security import certificate.p12 \
          -k "$KEYCHAIN_PATH" \
          -P "$CERTIFICATES_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/xcrun
        
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" \
          "$KEYCHAIN_PATH"
        
        # Find the certificate name dynamically
        echo "=== Looking for certificates ==="
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        
        # Extract certificate name more carefully
        CERT_LINE=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1)
        echo "Certificate line: $CERT_LINE"
        
        # Extract the name between quotes
        CERT_NAME=$(echo "$CERT_LINE" | cut -d'"' -f2)
        
        if [ -n "$CERT_NAME" ] && [ "$CERT_NAME" != "" ]; then
          echo "✅ Found certificate: '$CERT_NAME'"
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV
        else
          echo "❌ No Developer ID Application certificate found"
          echo "Available certificates:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          exit 1
        fi
        
        rm certificate.p12
    
    # Build the app
    - name: Create app bundle
      run: |
        # Use the create-app-bundle.sh script
        ./scripts/create-app-bundle.sh "${{ steps.version.outputs.version }}"
    
    # Sign the app
    - name: Sign app bundle
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        echo "🔏 Signing app with: $CERT_NAME"
        
        # Debug: Check certificate availability
        echo "=== Available certificates in keychain ==="
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        
        # Debug: Check if CERT_NAME is properly set
        if [ -z "$CERT_NAME" ]; then
          echo "❌ CERT_NAME is empty!"
          exit 1
        fi
        
        # Debug: Check entitlements file
        if [ ! -f "ClaudeCodeMonitor.entitlements" ]; then
          echo "❌ Entitlements file not found!"
          ls -la
          exit 1
        fi
        
        # Clean up app bundle root (just in case)
        echo "=== Cleaning app bundle root ==="
        find "ClaudeCodeMonitor.app" -maxdepth 1 -type f -delete 2>/dev/null || true
        find "ClaudeCodeMonitor.app" -maxdepth 1 -name "*.bundle" -type d -exec rm -rf {} + 2>/dev/null || true
        
        # Verify clean structure before signing
        echo "=== App bundle root after cleanup ==="
        ls -la "ClaudeCodeMonitor.app/"
        
        # Try signing (without --deep to preserve Node.js signature)
        echo "=== Attempting to sign ==="
        codesign --force --strict \
          --options runtime \
          --entitlements ClaudeCodeMonitor.entitlements \
          --sign "$CERT_NAME" \
          --timestamp \
          "ClaudeCodeMonitor.app"
        
        # Verify signature
        codesign --verify --deep --strict --verbose=2 "ClaudeCodeMonitor.app"
        codesign -dvvv "ClaudeCodeMonitor.app"
    
    # Ad-hoc sign if no certificates
    - name: Ad-hoc sign app bundle
      if: steps.check_signing.outputs.has_signing_cert != 'true'
      run: |
        echo "⚠️ Ad-hoc signing app (no Developer ID certificate)"
        codesign --force --deep --sign - "ClaudeCodeMonitor.app"
    
    # Create DMG
    - name: Create DMG
      run: |
        # Install create-dmg if needed
        if ! command -v create-dmg &> /dev/null; then
          brew install create-dmg
        fi
        
        DMG_NAME="ClaudeCodeMonitor-${{ steps.version.outputs.version }}.dmg"
        
        # Create DMG
        create-dmg \
          --volname "Claude Code Monitor" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "ClaudeCodeMonitor.app" 150 185 \
          --hide-extension "ClaudeCodeMonitor.app" \
          --app-drop-link 450 185 \
          --no-internet-enable \
          --hdiutil-quiet \
          "$DMG_NAME" \
          "ClaudeCodeMonitor.app"
        
        echo "DMG_PATH=$DMG_NAME" >> $GITHUB_ENV
        echo "✅ Created DMG: $DMG_NAME"
    
    # Sign DMG
    - name: Sign DMG
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        echo "🔏 Signing DMG..."
        codesign --force --sign "$CERT_NAME" --timestamp "$DMG_PATH"
        codesign --verify --verbose=2 "$DMG_PATH"
    
    # Notarize using action
    - name: Notarize app
      if: steps.check_signing.outputs.has_signing_cert == 'true' && steps.check_signing.outputs.has_notarization == 'true'
      uses: lando/notarize-action@v2
      with:
        product-path: ${{ env.DMG_PATH }}
        appstore-connect-username: ${{ secrets.NOTARIZATION_APPLE_ID }}
        appstore-connect-password: ${{ secrets.NOTARIZATION_PASSWORD }}
        appstore-connect-team-id: ${{ secrets.NOTARIZATION_TEAM_ID }}
        verbose: true
    
    # Staple notarization
    - name: Staple notarization
      if: steps.check_signing.outputs.has_signing_cert == 'true' && steps.check_signing.outputs.has_notarization == 'true'
      run: |
        echo "📎 Stapling notarization..."
        xcrun stapler staple "$DMG_PATH"
        xcrun stapler validate "$DMG_PATH"
    
    # Generate Sparkle appcast.xml
    - name: Generate Sparkle appcast.xml
      if: env.SPARKLE_PRIVATE_KEY != ''
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "🔏 Generating Sparkle appcast.xml..."
        ./scripts/generate-appcast.sh
        
        if [ -f "appcast.xml" ]; then
          echo "✅ Successfully generated appcast.xml"
        else
          echo "❌ Failed to generate appcast.xml"
          exit 1
        fi
    
    # Generate changelog
    - name: Generate changelog
      id: changelog
      run: |
        # Get previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$PREV_TAG" ]; then
          echo "## 🎉 Initial Release" > changelog.md
          echo "" >> changelog.md
          echo "First release of Claude Code Monitor!" >> changelog.md
        else
          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md
          git log --pretty=format:"* %s (%h)" $PREV_TAG..HEAD >> changelog.md
          echo "" >> changelog.md
          echo "" >> changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ steps.version.outputs.tag }}" >> changelog.md
        fi
        
        # Set output
        {
          echo "changelog<<EOF"
          cat changelog.md
          echo "EOF"
        } >> $GITHUB_OUTPUT
    
    # Create and push tag
    - name: Create and push tag
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    
    # Create release
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false
        files: |
          ${{ env.DMG_PATH }}
          appcast.xml
    
    # Cleanup
    - name: Clean up keychain
      if: always() && steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        if [ -n "$KEYCHAIN_PATH" ]; then
          security delete-keychain "$KEYCHAIN_PATH" || true
        fi
    
    # TODO: Update Homebrew formula
    - name: Update Homebrew Formula
      run: |
        echo "ℹ️ Homebrew formula update not implemented yet"