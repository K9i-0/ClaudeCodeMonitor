name: Build and Sign

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      is_dev_build:
        required: false
        type: boolean
        default: false
      create_release:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ''
    secrets:
      CERTIFICATES_P12:
        required: false
      CERTIFICATES_PASSWORD:
        required: false
      NOTARIZATION_APPLE_ID:
        required: false
      NOTARIZATION_PASSWORD:
        required: false
      NOTARIZATION_TEAM_ID:
        required: false
    outputs:
      dmg_path:
        description: "Path to the created DMG file"
        value: ${{ jobs.build.outputs.dmg_path }}

jobs:
  build:
    name: Build and Sign App
    runs-on: macos-latest
    outputs:
      dmg_path: ${{ steps.create_dmg.outputs.dmg_path }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      env:
        XCODE_VERSION: '16.2'
      run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
    
    # Check if we have signing certificates
    - name: Check signing prerequisites
      id: check_signing
      env:
        CERT_P12: ${{ secrets.CERTIFICATES_P12 }}
        CERT_PWD: ${{ secrets.CERTIFICATES_PASSWORD }}
        NOTARIZE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
        NOTARIZE_PWD: ${{ secrets.NOTARIZATION_PASSWORD }}
        NOTARIZE_TEAM: ${{ secrets.NOTARIZATION_TEAM_ID }}
      run: |
        if [ -n "$CERT_P12" ] && [ -n "$CERT_PWD" ]; then
          echo "has_signing_cert=true" >> "$GITHUB_OUTPUT"
          echo "✅ Signing certificates found"
        else
          echo "has_signing_cert=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ No signing certificates configured"
        fi
        
        if [ -n "$NOTARIZE_ID" ] && [ -n "$NOTARIZE_PWD" ] && [ -n "$NOTARIZE_TEAM" ]; then
          echo "has_notarization=true" >> "$GITHUB_OUTPUT"
          echo "✅ Notarization credentials found"
        else
          echo "has_notarization=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ No notarization credentials configured"
        fi
    
    # Setup keychain if we have certificates
    - name: Set up keychain
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        set -euo pipefail
        
        # Create a temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        
        # Add to search list
        security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed 's/"//g')"
        security default-keychain -s "$KEYCHAIN_PATH"
        
        # Store for later use
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
    
    # Import certificates
    - name: Import certificates
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      env:
        CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
        CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
      run: |
        set -euo pipefail
        
        # Setup cleanup trap
        CERT_FILE="certificate.p12"
        trap 'rm -f "$CERT_FILE"' EXIT
        
        # Decode and import certificate
        echo "$CERTIFICATES_P12" | base64 --decode > "$CERT_FILE"
        
        security import "$CERT_FILE" \
          -k "$KEYCHAIN_PATH" \
          -P "$CERTIFICATES_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/xcrun
        
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" \
          "$KEYCHAIN_PATH"
        
        # Find the certificate name dynamically
        echo "=== Looking for certificates ==="
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        
        # Extract certificate name safely
        CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1)
        
        if [ -z "$CERT_INFO" ]; then
          echo "❌ No Developer ID Application certificate found"
          echo "Available certificates:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          exit 1
        fi
        
        # Safe extraction of certificate name using awk to avoid command injection
        CERT_NAME=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
        
        if [ -n "$CERT_NAME" ]; then
          echo "✅ Found certificate: '$CERT_NAME'"
          # Sanitize certificate name before setting as env var
          printf '%s\n' "CERT_NAME=$CERT_NAME" >> "$GITHUB_ENV"
        else
          echo "❌ Failed to extract certificate name"
          exit 1
        fi
    
    # Build the app
    - name: Create app bundle
      run: |
        # Use the create-app-bundle.sh script
        ./scripts/create-app-bundle.sh "${{ inputs.version }}"
    
    # Sign the app
    - name: Sign app bundle
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        echo "🔏 Signing app with: $CERT_NAME"
        
        # Debug: Check certificate availability
        echo "=== Available certificates in keychain ==="
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        
        # Debug: Check if CERT_NAME is properly set
        if [ -z "$CERT_NAME" ]; then
          echo "❌ CERT_NAME is empty!"
          exit 1
        fi
        
        # Debug: Check entitlements file
        if [ ! -f "ClaudeCodeMonitor.entitlements" ]; then
          echo "❌ Entitlements file not found!"
          ls -la
          exit 1
        fi
        
        # Clean up app bundle root (just in case)
        echo "=== Cleaning app bundle root ==="
        find "ClaudeCodeMonitor.app" -maxdepth 1 -type f -delete 2>/dev/null || true
        find "ClaudeCodeMonitor.app" -maxdepth 1 -name "*.bundle" -type d -exec rm -rf {} + 2>/dev/null || true
        
        # Verify clean structure before signing
        echo "=== App bundle root after cleanup ==="
        ls -la "ClaudeCodeMonitor.app/"
        
        # Sign Sparkle.framework components if it exists
        if [ -d "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework" ]; then
          echo "=== Signing Sparkle.framework components ==="
          
          # Sign individual binaries first
          if [ -f "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" ]; then
            echo "  Signing Autoupdate binary..."
            codesign --force --options runtime --sign "$CERT_NAME" --timestamp \
              "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          fi
          
          if [ -f "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" ]; then
            echo "  Signing Sparkle binary..."
            codesign --force --options runtime --sign "$CERT_NAME" --timestamp \
              "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          fi
          
          # Sign Updater.app
          if [ -d "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" ]; then
            echo "  Signing Updater.app..."
            codesign --force --deep --options runtime --sign "$CERT_NAME" --timestamp \
              "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          fi
          
          # Sign XPCServices
          if [ -d "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices" ]; then
            echo "  Signing XPC Services..."
            find "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices" \
              -name "*.xpc" -exec codesign --force --deep --options runtime --sign "$CERT_NAME" --timestamp {} \;
          fi
          
          # Finally sign the framework itself
          echo "  Signing Sparkle.framework..."
          codesign --force --options runtime --sign "$CERT_NAME" --timestamp \
            "ClaudeCodeMonitor.app/Contents/Frameworks/Sparkle.framework"
        fi
        
        # Sign the app with --deep to ensure all components are signed
        echo "=== Attempting to sign app with --deep ==="
        codesign --force --deep --strict \
          --options runtime \
          --entitlements ClaudeCodeMonitor.entitlements \
          --sign "$CERT_NAME" \
          --timestamp \
          "ClaudeCodeMonitor.app"
        
        # Verify signature with detailed output
        echo "=== Verifying signature ==="
        codesign --verify --deep --strict --verbose=4 "ClaudeCodeMonitor.app"
        
        echo "=== Signature details ==="
        codesign -dvvv "ClaudeCodeMonitor.app"
        
        echo "=== Verifying with spctl ==="
        spctl -a -vvv -t install "ClaudeCodeMonitor.app" || echo "Note: spctl check may fail in CI environment"
    
    # Ad-hoc sign if no certificates
    - name: Ad-hoc sign app bundle
      if: steps.check_signing.outputs.has_signing_cert != 'true'
      run: |
        echo "⚠️ Ad-hoc signing app (no Developer ID certificate)"
        codesign --force --deep --sign - "ClaudeCodeMonitor.app"
    
    # Create DMG
    - name: Create DMG
      id: create_dmg
      run: |
        # Install create-dmg if needed
        if ! command -v create-dmg &> /dev/null; then
          brew install create-dmg
        fi
        
        DMG_NAME="ClaudeCodeMonitor-${{ inputs.version }}.dmg"
        
        # Set volume name based on build type
        if [ "${{ inputs.is_dev_build }}" == "true" ]; then
          VOLUME_NAME="Claude Code Monitor Dev"
        else
          VOLUME_NAME="Claude Code Monitor"
        fi
        
        # Create DMG
        create-dmg \
          --volname "$VOLUME_NAME" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "ClaudeCodeMonitor.app" 150 185 \
          --hide-extension "ClaudeCodeMonitor.app" \
          --app-drop-link 450 185 \
          --no-internet-enable \
          --hdiutil-quiet \
          "$DMG_NAME" \
          "ClaudeCodeMonitor.app"
        
        echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"
        echo "dmg_path=$DMG_NAME" >> "$GITHUB_OUTPUT"
        echo "✅ Created DMG: $DMG_NAME"
    
    # Sign DMG
    - name: Sign DMG
      if: steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        echo "🔏 Signing DMG..."
        codesign --force --sign "$CERT_NAME" --timestamp "$DMG_PATH"
        codesign --verify --verbose=2 "$DMG_PATH"
    
    # Notarize using action
    - name: Notarize app
      if: steps.check_signing.outputs.has_signing_cert == 'true' && steps.check_signing.outputs.has_notarization == 'true'
      uses: lando/notarize-action@v2
      with:
        product-path: ${{ env.DMG_PATH }}
        appstore-connect-username: ${{ secrets.NOTARIZATION_APPLE_ID }}
        appstore-connect-password: ${{ secrets.NOTARIZATION_PASSWORD }}
        appstore-connect-team-id: ${{ secrets.NOTARIZATION_TEAM_ID }}
        verbose: true
    
    # Staple notarization
    - name: Staple notarization
      if: steps.check_signing.outputs.has_signing_cert == 'true' && steps.check_signing.outputs.has_notarization == 'true'
      run: |
        echo "📎 Stapling notarization..."
        echo "DMG_PATH: $DMG_PATH"
        
        # Check if DMG exists
        if [ ! -f "$DMG_PATH" ]; then
          echo "❌ DMG file not found at: $DMG_PATH"
          ls -la
          exit 1
        fi
        
        # Verify DMG signature before stapling
        echo "=== Verifying DMG signature before stapling ==="
        codesign --verify --verbose=2 "$DMG_PATH"
        
        # Attempt to staple
        echo "=== Stapling notarization ticket ==="
        xcrun stapler staple -v "$DMG_PATH"
        
        # Validate the staple
        echo "=== Validating stapled notarization ==="
        xcrun stapler validate -v "$DMG_PATH"
    
    # Generate changelog for development releases
    - name: Generate changelog
      if: inputs.create_release == true && inputs.is_dev_build == true
      id: changelog
      run: |
        {
          echo "body<<CHANGELOG_EOF"
          echo "## 🚧 Development Release ${{ inputs.version }}"
          echo ""
          echo "This is an automated development release from the develop branch."
          echo "For testing purposes only. Not recommended for production use."
          echo ""
          echo "### Recent Changes"
          echo ""
          
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" "$LAST_TAG"..HEAD | head -20
          else
            git log --pretty=format:"* %s (%h)" -20
          fi
          
          echo ""
          echo "CHANGELOG_EOF"
        } >> "$GITHUB_OUTPUT"
    
    # Create GitHub Release if requested
    - name: Create Release
      if: inputs.create_release == true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        name: ${{ inputs.is_dev_build == true && format('Development Build {0}', inputs.version) || format('Release {0}', inputs.version) }}
        body: ${{ steps.changelog.outputs.body || '' }}
        draft: false
        prerelease: ${{ inputs.is_dev_build }}
        files: ${{ env.DMG_PATH }}
    
    # Always upload DMG as artifact for downstream jobs
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: dmg-artifact
        path: ${{ env.DMG_PATH }}
        retention-days: 1
    
    # Cleanup
    - name: Clean up keychain
      if: always() && steps.check_signing.outputs.has_signing_cert == 'true'
      run: |
        if [ -n "$KEYCHAIN_PATH" ]; then
          security delete-keychain "$KEYCHAIN_PATH" || true
        fi