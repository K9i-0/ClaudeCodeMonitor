name: Development Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Development Release
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get latest version
      id: version
      run: |
        # Get current version from Info.plist
        CURRENT_VERSION=$(defaults read "$PWD/Info.plist" CFBundleShortVersionString)
        
        # Append -dev suffix
        NEW_VERSION="${CURRENT_VERSION}-dev"
        
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "✅ Development version: $NEW_VERSION"

  build:
    needs: prepare
    name: Build and Sign
    uses: ./.github/workflows/build-and-sign.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      is_dev_build: true
    secrets:
      CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
      NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
      NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
      NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}

  release:
    needs: [prepare, build]
    name: Create Development Release
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # Download DMG artifact from build job
    - name: Download DMG
      uses: actions/download-artifact@v4
      with:
        name: dmg-artifact
        path: .
    
    # Generate simple changelog
    - name: Generate changelog
      id: changelog
      run: |
        echo "## 🚧 Development Release ${{ needs.prepare.outputs.version }}" > changelog.md
        echo "" >> changelog.md
        echo "This is an automated development release from the develop branch." >> changelog.md
        echo "For testing purposes only. Not recommended for production use." >> changelog.md
        echo "" >> changelog.md
        echo "### Recent Changes" >> changelog.md
        echo "" >> changelog.md
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          git log --pretty=format:"* %s (%h)" $LAST_TAG..HEAD | head -20 >> changelog.md
        else
          git log --pretty=format:"* %s (%h)" -20 >> changelog.md
        fi
        
        {
          echo "changelog<<EOF"
          cat changelog.md
          echo "EOF"
        } >> $GITHUB_OUTPUT
    
    # Create release (without tag push to avoid conflicts)
    - name: Create Development Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        name: Development Build ${{ needs.prepare.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: true
        files: |
          ClaudeCodeMonitor-${{ needs.prepare.outputs.version }}.dmg