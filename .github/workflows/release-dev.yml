name: Development Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  dev-release:
    name: Build Development Release
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.2.app
    
    - name: Get version from Info.plist
      id: version
      run: |
        # Extract version from Info.plist
        VERSION_LINE=$(grep -A1 "CFBundleShortVersionString" Info.plist | tail -1)
        VERSION=$(echo "$VERSION_LINE" | sed -E 's/.*<string>(.*)<\/string>.*/\1/')
        
        if [ -z "$VERSION" ]; then
          echo "❌ Failed to extract version from Info.plist"
          exit 1
        fi
        
        # Add -dev suffix for development builds
        DEV_VERSION="${VERSION}-dev"
        
        echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$DEV_VERSION" >> $GITHUB_OUTPUT
        echo "✅ Development version: $DEV_VERSION"
    
    # Build the app
    - name: Create app bundle
      run: |
        ./scripts/create-app-bundle.sh "${{ steps.version.outputs.version }}"
    
    # Ad-hoc sign (for development releases)
    - name: Sign app bundle
      run: |
        echo "⚠️ Ad-hoc signing development build"
        codesign --force --deep --sign - "ClaudeCodeMonitor.app"
    
    # Create DMG
    - name: Create DMG
      run: |
        if ! command -v create-dmg &> /dev/null; then
          brew install create-dmg
        fi
        
        DMG_NAME="ClaudeCodeMonitor-${{ steps.version.outputs.version }}.dmg"
        
        create-dmg \
          --volname "Claude Code Monitor Dev" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "ClaudeCodeMonitor.app" 150 185 \
          --hide-extension "ClaudeCodeMonitor.app" \
          --app-drop-link 450 185 \
          --no-internet-enable \
          --hdiutil-quiet \
          "$DMG_NAME" \
          "ClaudeCodeMonitor.app"
        
        echo "DMG_PATH=$DMG_NAME" >> $GITHUB_ENV
        echo "✅ Created DMG: $DMG_NAME"
    
    # Generate changelog for recent commits
    - name: Generate changelog
      id: changelog
      run: |
        echo "## 🚧 Development Build ${{ steps.version.outputs.version }}" > changelog.md
        echo "" >> changelog.md
        echo "This is a development build from the \`develop\` branch. Not recommended for production use." >> changelog.md
        echo "" >> changelog.md
        echo "### Recent Changes" >> changelog.md
        echo "" >> changelog.md
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          git log --pretty=format:"* %s (%h)" $LAST_TAG..HEAD | head -20 >> changelog.md
        else
          git log --pretty=format:"* %s (%h)" -20 >> changelog.md
        fi
        
        echo "" >> changelog.md
        echo "" >> changelog.md
        echo "### Installation" >> changelog.md
        echo "1. Download the DMG file" >> changelog.md
        echo "2. Open the DMG and drag ClaudeCodeMonitor to Applications" >> changelog.md
        echo "3. You may need to right-click and select 'Open' on first launch" >> changelog.md
        
        {
          echo "changelog<<EOF"
          cat changelog.md
          echo "EOF"
        } >> $GITHUB_OUTPUT
    
    # Create development release
    - name: Create Development Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Dev ${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: true
        files: |
          ${{ env.DMG_PATH }}
        target_commitish: develop